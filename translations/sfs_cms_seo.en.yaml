checks:
    fetch_error:
        title: "The published page could not be fetched"
        description: "Check that the URL is reachable from the application container and that the local domain/proxy is working."
    http_status:
        title: "The page does not return a successful HTTP status"
        description: "Published pages should return a 2xx HTTP response before SEO checks can be trusted."
    html_content_type:
        title: "The response is not HTML"
        description: "SEO checks require a text/html response."
    title:
        title: "Page title"
        description: "Use one descriptive title between 30 and 65 characters."
    meta_description:
        title: "Meta description"
        description: "Use one descriptive meta description between 70 and 160 characters."
    canonical:
        title: "Canonical URL"
        description: "Add a canonical URL that points to this published page."
    alternates:
        title: "Alternate language URLs"
        description: "Generate one rel=alternate hreflang link for each published locale of this site."
    h1:
        title: "H1 heading"
        description: "Use exactly one H1 heading on the page."
    h1_missing:
        title: "Missing H1 heading"
        description: "Add one visible H1 that describes the page topic."
    h1_multiple:
        title: "Multiple H1 headings"
        description: "Keep a single primary H1 and move secondary headings to H2 or lower levels."
    heading_structure:
        title: "Heading structure"
        description: "Use H2 headings to split the page into scannable sections when the content is long enough."
    image_alt:
        title: "Image alternative text"
        description: "Add meaningful alt text to informative images. Decorative images can use an empty alt attribute intentionally."
    robots:
        title: "Robots meta tag"
        description: "The page is indexable according to its robots meta tag."
    robots_noindex:
        title: "Robots noindex found"
        description: "Remove noindex if this published page should be visible in search results."
    word_count:
        title: "Content length"
        description: "Short pages can rank, but strategic pages usually need enough useful copy to explain the topic."
    robots_reachable:
        title: "robots.txt is reachable"
        description: "The site robots.txt endpoint should be publicly reachable and served as text/plain."
    robots_sitemap_index:
        title: "robots.txt exposes the sitemap index"
        description: "When a sitemap index is configured, robots.txt should point crawlers to it."
    sitemap_index_reachable:
        title: "Sitemap index is reachable"
        description: "The configured sitemap index should return a successful XML response."
    sitemap_index_contains_configured_sitemaps:
        title: "Sitemap index contains configured sitemaps"
        description: "The sitemap index should include every configured sitemap and external sitemap URL."
    sitemap_reachable:
        title: "Configured sitemaps are reachable"
        description: "Every configured sitemap URL should return a successful XML response."
    slash_route_redirect:
        title: "Root slash redirects to a localized route"
        description: "When slash_route is enabled, the site root should redirect to one of the configured localized roots."
