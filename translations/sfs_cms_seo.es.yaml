checks:
    fetch_error:
        title: "No se ha podido descargar la página publicada"
        description: "Comprueba que la URL sea accesible desde el contenedor de la aplicación y que el dominio/proxy local funcione."
    http_status:
        title: "La página no devuelve un estado HTTP correcto"
        description: "Las páginas publicadas deberían devolver una respuesta HTTP 2xx antes de confiar en el análisis SEO."
    html_content_type:
        title: "La respuesta no es HTML"
        description: "Las comprobaciones SEO necesitan una respuesta text/html."
    title:
        title: "Título de página"
        description: "Usa un título descriptivo entre 30 y 65 caracteres."
    meta_description:
        title: "Meta description"
        description: "Usa una meta description descriptiva entre 70 y 160 caracteres."
    canonical:
        title: "URL canonical"
        description: "Añade una URL canonical que apunte a esta página publicada."
    alternates:
        title: "URLs alternates por idioma"
        description: "Genera un enlace rel=alternate hreflang por cada locale publicado de este site."
    h1:
        title: "Encabezado H1"
        description: "Usa exactamente un encabezado H1 en la página."
    h1_missing:
        title: "Falta el encabezado H1"
        description: "Añade un H1 visible que describa el tema de la página."
    h1_multiple:
        title: "Hay varios encabezados H1"
        description: "Mantén un único H1 principal y mueve los encabezados secundarios a H2 o niveles inferiores."
    heading_structure:
        title: "Estructura de encabezados"
        description: "Usa encabezados H2 para dividir la página en secciones escaneables cuando el contenido lo justifique."
    image_alt:
        title: "Texto alternativo de imágenes"
        description: "Añade textos alt útiles a las imágenes informativas. Las decorativas pueden usar alt vacío de forma intencionada."
    robots:
        title: "Meta robots"
        description: "La página es indexable según su meta robots."
    robots_noindex:
        title: "Se ha encontrado robots noindex"
        description: "Elimina noindex si esta página publicada debe aparecer en resultados de búsqueda."
    word_count:
        title: "Longitud del contenido"
        description: "Las páginas cortas pueden posicionar, pero las páginas estratégicas suelen necesitar suficiente texto útil para explicar el tema."
    robots_reachable:
        title: "robots.txt accesible"
        description: "El endpoint robots.txt del site debería ser público y servirse como text/plain."
    robots_sitemap_index:
        title: "robots.txt expone el índice de sitemap"
        description: "Cuando hay un índice de sitemap configurado, robots.txt debería apuntar los crawlers a él."
    sitemap_index_reachable:
        title: "Índice de sitemap accesible"
        description: "El índice de sitemap configurado debería devolver una respuesta XML correcta."
    sitemap_index_contains_configured_sitemaps:
        title: "El índice contiene los sitemaps configurados"
        description: "El índice de sitemap debería incluir cada sitemap configurado y cada sitemap externo."
    sitemap_reachable:
        title: "Sitemaps configurados accesibles"
        description: "Cada URL de sitemap configurada debería devolver una respuesta XML correcta."
    slash_route_redirect:
        title: "La raíz redirige a una ruta localizada"
        description: "Cuando slash_route está activo, la raíz del site debería redirigir a una de las raíces localizadas configuradas."
